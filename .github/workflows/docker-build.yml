name: Build and Push Docker Image

# Пайплайн запускается автоматически при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Сборка происходит на виртуальной машине Ubuntu

    steps:
    # 1. Скачиваем код из репозитория на виртуальную машину GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Логинимся на Docker Hub, используя секреты репозитория
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Генерируем правильные теги для образа (latest и короткий хэш коммита SHA)
    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/my-flask-app
        tags: |
          type=raw,value=latest
          type=sha,format=short

    # 4. Собираем Docker-образ из нашего Dockerfile и загружаем его на Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ id.meta.outputs.tags }}
        labels: ${{ id.meta.outputs.labels }}
